<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lesson Navbar</title>
<link rel="stylesheet" href="/static/css/lesson6.css">
</head>

<body>

<div class="container">

  <h1>🧭 Lesson: Navbar</h1>

  <!-- อธิบาย -->
  <div class="card">
    <h3>🧠 ลองนึกภาพ</h3>
    <p>
      Navbar = เมนูด้านบนเว็บ  
      เหมือน “ปุ่มเลือกด่าน” 🎮
    </p>

    <div class="code-box">
&lt;nav&gt;<br>
&nbsp;&nbsp;&lt;a href="#"&gt;Home&lt;/a&gt;<br>
&nbsp;&nbsp;&lt;a href="#"&gt;About&lt;/a&gt;<br>
&nbsp;&nbsp;&lt;a href="#"&gt;Contact&lt;/a&gt;<br>
&lt;/nav&gt;
    </div>
  </div>

  <!-- อธิบายเพิ่ม -->
  <div class="card">
    <h3>💡 สำคัญยังไง?</h3>
    <ul>
      <li>ช่วยให้ผู้ใช้ไปหน้าอื่นได้</li>
      <li>ทุกเว็บต้องมี 🔥</li>
    </ul>
  </div>

  <!-- ภารกิจ -->
  <div class="card">
    <h3>🎯 ภารกิจ</h3>
    <p>
      สร้าง <b>&lt;nav&gt;</b> ที่มีลิงก์  
      <b>Home</b>, <b>About</b>, <b>Contact</b>
    </p>

    <textarea id="codeInput" placeholder="ลองพิมพ์โค้ดที่นี่..."></textarea>

    <button class="btn" onclick="checkCode()">ตรวจคำตอบ</button>

    <div class="result" id="result"></div>
  </div>

  <button class="btn" onclick="goBack()">⬅ กลับ Dashboard</button>

</div>

<script src="/static/js/config.js"></script>
<script src="/static/js/lesson6.js"></script>

</body>
</html>
