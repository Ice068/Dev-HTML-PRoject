<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevQuest Login</title>
  <link rel="stylesheet" href="/static/css/login.css">
</head>
<body>

<div class="background"></div>

<div class="card">
  <div class="logo">🎮 Dev<span>Quest</span></div>

  <div class="tabs">
    <button type="button" id="loginTab" class="active">เข้าสู่ระบบ</button>
    <button type="button" id="signupTab">สร้างบัญชี</button>
  </div>

  <form id="form" novalidate>
    <div class="input-group">
      <label for="username">ชื่อผู้ใช้</label>
      <input
        type="text"
        id="username"
        placeholder="a-z, 0-9, _ (3-30 ตัวอักษร)"
        autocomplete="username"
        minlength="3"
        maxlength="30"
        required
      >
    </div>

    <div class="input-group">
      <label for="password">รหัสผ่าน</label>
      <input
        type="password"
        id="password"
        placeholder="อย่างน้อย 8 ตัวอักษร"
        autocomplete="current-password"
        minlength="8"
        maxlength="128"
        required
      >
    </div>

    <div class="input-group" id="confirmGroup" style="display:none;">
      <label for="confirmPassword">ยืนยันรหัสผ่าน</label>
      <input
        type="password"
        id="confirmPassword"
        placeholder="ยืนยันรหัสผ่านอีกครั้ง"
        autocomplete="new-password"
        maxlength="128"
      >
    </div>

    <button type="submit" class="btn" id="submitBtn">ลุยเลย! (Login)</button>
  </form>

  <p id="message" role="alert"></p>
</div>

<script src="/static/js/config.js"></script>
<script src="/static/js/login.js"></script>
</body>
</html>
